# ==============================================================================
# Moh Tech Care - Apache 2.4 VirtualHost Configuration
# Single Source of Truth: Serves Vite Production Frontend + PHP REST API on Port 80
# ==============================================================================

<VirtualHost *:80>
    ServerName mohtechcare.local
    ServerAlias localhost
    DocumentRoot "C:/xampp/htdocs/Dr Tech care/frontend/dist"

    <Directory "C:/xampp/htdocs/Dr Tech care/frontend/dist">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Single Page Application (SPA) routing fallback
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
        </IfModule>
    </Directory>

    # API Routing: maps /api/* directly to backend/public/index.php
    Alias /api "C:/xampp/htdocs/Dr Tech care/backend/public"
    <Directory "C:/xampp/htdocs/Dr Tech care/backend/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /api/
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^(.*)$ index.php [QSA,L]
        </IfModule>
    </Directory>

    # Uploads directory access for face snapshots and voice/sound files
    Alias /uploads "C:/xampp/htdocs/Dr Tech care/uploads"
    <Directory "C:/xampp/htdocs/Dr Tech care/uploads">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog "logs/mohtechcare-error.log"
    CustomLog "logs/mohtechcare-access.log" combined
</VirtualHost>
