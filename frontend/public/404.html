<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dr.Tech.Care - กำลังเปลี่ยนเส้นทาง...</title>
    <script>
      // Single Page Application Fallback for GitHub Pages
      // Encodes path and query parameters into hash route to prevent 404 on page refresh
      (function() {
        var repoName = '/Strong-Care';
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;

        var subPath = path;
        if (subPath.indexOf(repoName) === 0) {
          subPath = subPath.substring(repoName.length);
        }
        if (subPath.startsWith('/')) {
          subPath = subPath.substring(1);
        }

        var targetHash = subPath ? '#/' + subPath : (hash || '#/kiosk');
        var targetUrl = repoName + '/' + (search || '') + targetHash;
        window.location.replace(targetUrl);
      })();
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #F0FAF4;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #0B2B2B;
      }
      .card {
        background: #FFFFFF;
        padding: 32px;
        border-radius: 24px;
        box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
        text-align: center;
        max-width: 380px;
        border: 1px solid #D1FAE5;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #D1FAE5;
        border-top-color: #10B981;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="spinner"></div>
      <h2 style="font-size: 1.15rem; margin-bottom: 8px; font-weight: 700;">กำลังโหลด Dr.Tech.Care...</h2>
      <p style="font-size: 0.875rem; color: #4B5563; margin: 0;">กำลังนำทางสู่หน้าของระบบ</p>
    </div>
  </body>
</html>
